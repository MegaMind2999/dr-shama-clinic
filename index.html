<script>
  // Every page lives under ar/ or en/: the saved choice first, then the browser language, then Arabic.
  var pick = (document.cookie.match(/(?:^|;\s*)NEXT_LOCALE=(ar|en)/) || [])[1];
  var langs = navigator.languages || [navigator.language || ""];
  for (var i = 0; i < langs.length && !pick; i++) {
    var l = String(langs[i]).toLowerCase();
    if (l.indexOf("ar") === 0) pick = "ar";
    else if (l.indexOf("en") === 0) pick = "en";
  }
  location.replace((pick || "ar") + "/");
</script>
